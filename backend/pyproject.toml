[tool.poetry]
name = "llm-finetune-backend"
version = "0.1.0"
description = "Backend service skeleton for llm-finetune-platform"
authors = ["zephyr <zephyr@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlmodel = "^0.0.21"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"
python-jose = "^3.3.0"
passlib = { extras = ["argon2"], version = "^1.7.4" }
redis = "^5.0.7"
email-validator = "^2.2.0"
pydantic-settings = "^2.3.4"
python-multipart = "^0.0.9"
sacrebleu = "^2.4.0"
rouge-score = "^0.1.2"
evaluate = "^0.4.2"
fpdf2 = "^2.7.8"
grpcio = "^1.67.0"
protobuf = "^4.25.3"
celery = "^5.4.0"
transformers = "^4.57.1"
peft = "^0.17.1"
accelerate = "^1.1.0"
torch = "^2.4.1"
tokenizers = "^0.22.1"
sentencepiece = "^0.1.99"
numpy = "^1.26.4"
scipy = "^1.11.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"
ruff = "^0.6.3"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
