services:
  db:
    image: postgres:15-alpine
    container_name: llmft-postgres
    environment:
      POSTGRES_DB: llmft
      POSTGRES_USER: llmft
      POSTGRES_PASSWORD: llmft
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmft -d llmft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llmft-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    container_name: llmft-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    environment:
      DATABASE_URL: postgresql+psycopg2://llmft:llmft@db:5432/llmft
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_STORAGE_ROOT: /data/storage
      CORS_ORIGINS: '["http://localhost:8080"]'
      CELERY_TASK_ALWAYS_EAGER: "true"
    volumes:
      - backend-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    container_name: llmft-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend-storage:
