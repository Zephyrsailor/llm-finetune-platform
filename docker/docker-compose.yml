version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: llmft-postgres
    environment:
      POSTGRES_DB: llmft
      POSTGRES_USER: llmft
      POSTGRES_PASSWORD: llmft
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: llmft-redis
    ports:
      - "6379:6379"

  backend:
    container_name: llmft-backend
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend
    environment:
      DATABASE_URL: postgresql+psycopg2://llmft:llmft@db:5432/llmft
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_STORAGE_ROOT: /data/storage
      CORS_ORIGINS: '["http://localhost:8080"]'
      CELERY_TASK_ALWAYS_EAGER: "true"
    volumes:
      - backend-storage:/data/storage
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    container_name: llmft-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend-storage:
